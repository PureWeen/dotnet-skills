name: blazor-component-readiness
description: Evaluates evidence-backed local assessment of released Blazor component packages
type: capability
defaults:
  timeout: 20m
  runs: 1
scoring:
  threshold: 1.0
stimuli:
  - name: Distinguish release intent from package facts
    prompt: |
      Our release workflow says the Blazor control package is signed and publishes an SBOM. Review only
      the supplied workflow text and captured package inventory, then tell me what those materials
      actually establish for a vendor self-assessment. Do not use the network.
    environment:
      files:
        - src: fixtures/artifact-truth
          dest: fixture
    graders:
      - type: output-matches
        config:
          pattern: (?i)(intent|claim).*(does not|cannot|not).*(establish|prove)
      - type: output-matches
        config:
          pattern: (?i)(signature|signed).*(SBOM|software bill)
      - type: exit-success
      - type: prompt
    rubric:
      - Separates what the release configuration intends from what the captured package bytes prove
      - Does not report signing or an SBOM as established when neither artifact is present
      - States the smallest additional artifact needed to resolve each uncertainty

  - name: Classify three different evidence boundaries
    prompt: |
      Produce a local factual assessment for the supplied Blazor Grid package. One package fact is
      contradicted by the artifact, one release fact can only come from the owner, and one runtime
      check was never run. Keep those three situations distinct, finish the complete report under
      ./out, and verify it without network access.
    environment:
      files:
        - src: fixtures/unified
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/unified.validation.json
      - type: file-contains
        config:
          path: out/revisions/0001/unified.assessment.json
          value: '"status":"gap"'
      - type: file-contains
        config:
          path: out/revisions/0001/unified.assessment.json
          value: '"status":"owner evidence required"'
      - type: file-contains
        config:
          path: out/revisions/0001/unified.assessment.json
          value: '"status":"not tested"'
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
          stdout_matches: VALID unified 110
      - type: exit-success
      - type: prompt
    rubric:
      - The contradictory artifact fact, unavailable owner-controlled fact, and unrun probe receive different factual classifications
      - The response distinguishes deterministic file validation from confidence in the underlying claims

  - name: Select only owner-controlled documentation
    prompt: |
      I captured package-owner metadata plus a list of possible pages for our Blazor control. Identify the
      exact documentation set suitable for an offline vendor assessment. Do not browse, and do not
      treat community commentary as official product documentation.
    environment:
      files:
        - src: fixtures/documentation
          dest: fixture
    graders:
      - type: output-contains
        config:
          substring: https://components.example.test/docs/widget
      - type: output-contains
        config:
          substring: https://code.example.test/components/docs-widget/blob/v1.0.0/README.md
      - type: output-not-contains
        config:
          substring: https://community.example.test/widget-review
      - type: exit-success
      - type: prompt
    rubric:
      - Includes every supplied owner-controlled documentation source
      - Excludes the supplied third-party review from the official source set
      - Does not invent additional URLs or claim that discovery contacted external services

  - name: Use a bounded internal owner record
    prompt: |
      The package owner supplied an internal accessibility audit alongside the exact Blazor Grid package.
      Use it where it directly applies, label where it came from, and create and verify the complete
      local report under ./out. Do not publish or upload anything.
    environment:
      files:
        - src: fixtures/unified
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/unified.validation.json
      - type: file-contains
        config:
          path: out/revisions/0001/unified.assessment.json
          value: '"status":"verified"'
      - type: file-contains
        config:
          path: out/revisions/0001/unified.evidence.json
          value: owner-supplied-internal-evidence
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Uses the internal record only for claims it directly supports
      - Preserves a clear owner-supplied internal provenance label
      - Does not equate a valid local manifest with independent approval of the evidence

  - name: Assess a package with no public source
    prompt: |
      We ship this Blazor control as binaries and do not publish its source. Produce a bounded
      vendor assessment from the exact local package and official captured documentation, writing
      and verifying the complete report under ./out. Do not treat missing source as a failed fetch.
    environment:
      files:
        - src: fixtures/closed
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"availability":"closed-source"'
      - type: file-exists
        config:
          path: out/revisions/0001/unified.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
      - type: output-not-matches
        config:
          pattern: (?i)(clone|source repository).*(required|must)
      - type: exit-success
      - type: prompt
    rubric:
      - Completes a bounded assessment without requiring a source repository
      - Records the owner-declared source boundary without turning it into a retrieval failure
      - Keeps source-dependent conclusions appropriately limited

  - name: Produce one complete component record
    prompt: |
      Create the complete factual record for the supplied Blazor Grid package as one component-level
      assessment. Use every core requirement exactly once, render the local report under ./out,
      and verify the result. No external services are available.
    environment:
      files:
        - src: fixtures/unified
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/unified.report.md
      - type: file-exists
        config:
          path: out/revisions/0001/unified.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
          stdout_matches: VALID unified 110
      - type: exit-success
      - type: prompt
    rubric:
      - Produces one complete record with no missing, duplicated, or independently invented requirements
      - Reports the exact local report and validation-manifest paths

  - name: Bind package and component records
    prompt: |
      Assess the supplied Blazor library package once for package-wide facts and assess only its Grid
      control for component facts. Keep the two records separate, bind the component to the exact
      validated package result, render both under ./out, and verify both. Stay local.
    environment:
      files:
        - src: fixtures/library
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/package-revisions/0001/package.validation.json
      - type: file-exists
        config:
          path: out/grid-revisions/0001/component.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/package-revisions/0001 --kind package --rows 46
          expected_exit_code: 0
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/grid-revisions/0001 --kind component --rows 64
          expected_exit_code: 0
      - type: file-contains
        config:
          path: out/grid-revisions/0001/component.assessment.json
          value: '"package_reference":{'
      - type: exit-success
      - type: prompt
    rubric:
      - Package-wide and component-specific requirements are separated into the correct complete records
      - The component result is bound to the exact validated package revision rather than a loose package name

  - name: Preserve supplied candidate identity
    prompt: |
      Evaluate the unpublished Blazor package file in the fixture as the release candidate it is. Preserve
      the exact package identity and bytes, create the complete local assessment under ./out, and
      verify it. Do not substitute a published or rebuilt package.
    environment:
      files:
        - src: fixtures/candidate
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"acquisition":"release-candidate"'
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"package_id":"candidate.widget"'
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"version":"3.0.0-rc.1"'
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Uses the supplied candidate bytes without replacing them with a different build
      - Reports the normalized package ID, prerelease version, and digest from the exact file

  - name: Complete an isolated two-control library
    prompt: |
      Build a complete local factual index for the supplied Blazor package containing Grid and Chart.
      Freeze the exact inventory, keep each control's evidence isolated, cover every claimed render
      mode, validate all package and control records, and write the final JSON and Markdown indexes
      under ./out. Nothing may be uploaded or pushed.
    environment:
      files:
        - src: fixtures/library
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/inventory.confirmed.json
      - type: file-exists
        config:
          path: out/library-index.json
      - type: file-exists
        config:
          path: out/library-index.md
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-library --root out --packages 1 --components 2
          expected_exit_code: 0
          stdout_matches: VALID library 1 2
      - type: exit-success
      - type: prompt
    rubric:
      - The confirmed inventory accounts for the exact package and both controls
      - Each control has its own bounded evidence and result while sharing only the validated package record
      - The final index accurately reports completion, modes, status counts, and local report links

  - name: Keep the generated output factual
    prompt: |
      Generate and verify the complete local report for the supplied Blazor Grid package. I only want the
      factual record and status counts this time, not a ship decision, ranking, or remediation
      priorities. Write everything under ./out and remain offline.
    environment:
      files:
        - src: fixtures/unified
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/unified.report.md
      - type: file-not-exists
        config:
          path: '**/decision-guidance.md'
      - type: output-not-matches
        config:
          pattern: (?i)(release verdict|ship decision|priority ranking)
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind unified --rows 110
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Produces the requested factual assessment without adding an unsolicited decision
      - Does not create a ranked remediation artifact
      - Clearly separates factual limitations from deterministic structural validation

  - name: Stay dormant for ordinary component authoring
    prompt: Create a reusable Blazor date-range picker with keyboard navigation and form validation.
    expect_activation: false
    rubric:
      - Did not attempt a package readiness assessment and responds as an ordinary Blazor component-authoring task
      - Does not request package evidence, create readiness artifacts, or claim certification
      - Provides implementation guidance appropriate to the requested date-range picker

  - name: Stay dormant for application debugging
    prompt: My Blazor page throws after navigation when a scoped service is disposed. Help me debug it.
    expect_activation: false
    rubric:
      - Did not attempt a vendor readiness workflow and diagnoses the application lifetime or disposal problem
      - Does not request package inventory, evidence ledgers, or readiness output paths
      - Provides a bounded debugging direction for the scoped-service failure

  - name: Stay dormant for framework pull request review
    prompt: Review this ASP.NET Core framework pull request for regressions in interactive server rendering.
    expect_activation: false
    rubric:
      - Did not attempt vendor package self-assessment and treats the request as first-party framework review
      - Does not create readiness reports, evidence ledgers, or package inventory
      - Keeps the response focused on interactive-server regression risk

  - name: Stay dormant for generic package creation
    prompt: Help me pack a class library with symbols, Source Link, and deterministic builds.
    expect_activation: false
    rubric:
      - Did not attempt a Blazor readiness assessment and answers the generic packaging request
      - Does not request component inventories, render-mode probes, or readiness evidence
      - Gives relevant symbols, Source Link, and deterministic-build guidance
